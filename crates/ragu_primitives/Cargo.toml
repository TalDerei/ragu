[package]
name = "ragu_primitives"
version.workspace = true
authors.workspace = true
description = "Low-level gadgets and algorithms; intended for internal use in the Ragu project"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "README.md"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/ragu_primitives"
categories = [
  "cryptography",
  "mathematics",
  "algorithms",
  "development-tools",
  "no-std",
]
keywords = ["cryptography", "zero-knowledge", "gadgets", "poseidon", "circuits"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]
all-features = true

[features]
alloc = []
default = ["alloc"]
std = []
# Exposes the `fv_utils` module: thin wrappers over crate-internal constructors
# that bypass a gadget's invariant (e.g. a `Boolean` over an arbitrary wire), so
# the trace-extraction tooling (`qa/crates/lean_extraction`, its own workspace)
# can hand input wires to the real gadgets instead of re-implementing them. Not
# part of the stable public API; never enable it from a member of the repo-root
# workspace, where Cargo would unify it into the library builds.
unstable-fv = []

[lib]
bench = false

[dependencies]
ragu_arithmetic = { path = "../ragu_arithmetic", version = "0.0.0", default-features = false, features = ["alloc"] }
ragu_core = { path = "../ragu_core", version = "0.0.0", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0.12", default-features = false }

# Needed for the `Write` derive macro.
ragu_macros = { path = "../ragu_macros", version = "0.0.0" }

[dev-dependencies]
ff = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }
group = { workspace = true }
ragu_pasta = { path = "../ragu_pasta", version = "0.0.0", features = ["baked"] }
gungraun = { workspace = true }
proptest = { workspace = true }
ragu_testing = { path = "../ragu_testing", version = "0.0.0" }

[[bench]]
name = "gungraun"
harness = false
